name: Production Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'services/**'
      - 'infrastructure/terraform/**'
      - 'ansible/**'
      - '.github/workflows/deploy.yml'

permissions:
  id-token: write
  contents: read

jobs:
  infrastructure:
    name: Provision Infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: infrastructure/terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: infrastructure/terraform

  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, user-service, product-service, order-service]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest

  deploy:
    name: Ansible Configuration
    needs: [infrastructure, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: infrastructure/terraform

      - name: Get EC2 IP
        id: get-ip
        run: |
          IP=$(terraform output -raw ec2_public_ip)
          if [ -z "$IP" ]; then
            echo "ERRO: O IP da EC2 veio vazio!"
            exit 1
          fi
          echo "EC2_IP=$IP" >> $GITHUB_OUTPUT
        working-directory: infrastructure/terraform

      - name: Setup SSH Key
        run: |
          cat << 'EOF' > microservices-key.pem
          ${{ secrets.SSH_PRIVATE_KEY }}
          EOF
          chmod 400 microservices-key.pem

      - name: Run Ansible Playbook
        run: |
          ansible-playbook -i "${{ steps.get-ip.outputs.EC2_IP }}," \
            --private-key microservices-key.pem \
            -u ec2-user \
            -e "docker_username=${{ secrets.DOCKERHUB_USERNAME }}" \
            ansible/playbooks/deploy.yml
        env:
          ANSIBLE_HOST_KEY_CHECKING: False
