---
- name: Setup Docker and Run Sanity App
  hosts: all
  become: yes
  gather_facts: no
  tasks:
    - name: Wait for SSH
      raw: echo "ready"
      retries: 20
      delay: 10

    - name: Wait for Cloud-init
      raw: while [ ! -f /var/lib/cloud/instance/boot-finished ]; do sleep 2; done

    - name: Install Docker (Universal Amazon Linux command)
      raw: sudo yum install -y docker || sudo dnf install -y docker

    - name: Start and Configure Docker
      raw: |
        sudo systemctl start docker
        sudo systemctl enable docker
        sudo usermod -aG docker ec2-user

    - name: Run App
      raw: |
        sudo docker pull {{ docker_image }}
        sudo docker rm -f sanity-app || true
        sudo docker run -d --name sanity-app -p 80:80 {{ docker_image }}
