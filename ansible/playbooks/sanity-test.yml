---
- name: Setup Docker and Run Sanity App
  hosts: all
  become: yes
  gather_facts: no
  tasks:
    - name: Wait for SSH to be fully responsive
      raw: echo "SSH is up"
      register: ssh_check
      until: ssh_check.rc == 0
      retries: 20
      delay: 10

    - name: Install Docker
      shell: dnf install -y docker
      
    - name: Start and Enable Docker
      shell: |
        systemctl start docker
        systemctl enable docker

    - name: Ensure ec2-user is in docker group
      shell: usermod -aG docker ec2-user

    - name: Run Sanity Container
      shell: |
        docker pull {{ docker_image }}
        docker rm -f sanity-app || true
        docker run -d --name sanity-app -p 80:80 {{ docker_image }}
