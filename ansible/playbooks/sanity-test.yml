---
- name: Setup Docker and Run Sanity App
  hosts: all
  become: yes
  gather_facts: no
  tasks:
    - name: Wait for system to be ready
      wait_for_connection:
        timeout: 60

    - name: Install Docker
      dnf:
        name: docker
        state: present

    - name: Start and Enable Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Ensure ec2-user is in docker group
      user:
        name: ec2-user
        groups: docker
        append: yes

    - name: Run Sanity Container via Shell
      shell: |
        docker pull {{ docker_image }}
        docker rm -f sanity-app || true
        docker run -d --name sanity-app -p 80:80 {{ docker_image }}
