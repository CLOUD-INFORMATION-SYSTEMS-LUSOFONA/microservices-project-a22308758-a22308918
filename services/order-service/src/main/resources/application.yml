server:
  port: 8083

spring:
  spring:
    application:
      name: order-service
    datasource:
      url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:microservicesdb}
      username: ${DB_USER:dbadmin}
      password: ${DB_PASSWORD:ChangeMe123!}
      driver-class-name: org.postgresql.Driver
    jpa:
      open-in-view: false
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          format_sql: true
      hibernate:
        format_sql: true
  
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
    consumer:
      group-id: order-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: pt.ulusofona.orderservice.event.OrderCreatedEvent
        spring.json.add.type.headers: false
# Feign Client Configuration
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: basic

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
  info:
    title: Order Service API
    description: Microservice for order management with Kafka and OpenFeign
    version: 1.0.0
    contact:
      name: Cloud Computing Course
      email: support@example.com

# Service URLs (for Feign clients)
services:
  user:
    url: http://localhost:8081
  product:
    url: http://localhost:8082

    #    bootstrap-servers: kafka:9092 url: http://user-service:8081 url: http://product-service:8082

# Optional AWS SQS consumer for product-created events (same queue URL as product-service producer)
cloud:
  sqs:
    product-events-consumer:
      enabled: false
      queue-url: "https://sqs.us-east-1.amazonaws.com/759316131518/microservices-project-queue"
      region: "us-east-1"
      poll-interval-ms: 5000
      max-number-of-messages: 10
      wait-time-seconds: 20

