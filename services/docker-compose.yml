version: '3.8'

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  user-service:
    image: ${DOCKERHUB_USERNAME:-local}/user-service:latest
    build: ./user-service
    ports:
      - "8081:8081"

  product-service:
    image: ${DOCKERHUB_USERNAME:-local}/product-service:latest
    build: ./product-service
    ports:
      - "8082:8082"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CLOUD_SQS_PRODUCT_EVENTS_ENABLED: "true"
      CLOUD_SQS_PRODUCT_EVENTS_QUEUE_URL: "https://sqs.us-east-1.amazonaws.com/759316131518/microservices-project-queue"
      #AWS_ACCESS_KEY_ID: "" #alterar dps
      #AWS_SECRET_ACCESS_KEY: "" #alterar dps
      AWS_REGION: "us-east-1"

  order-service:
    image: ${DOCKERHUB_USERNAME:-local}/order-service:latest
    build: ./order-service
    ports:
      - "8083:8083"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVICES_USER_URL: http://user-service:8081
      SERVICES_PRODUCT_URL: http://product-service:8082
      CLOUD_SQS_PRODUCT_EVENTS_CONSUMER_ENABLED: "true"
      CLOUD_SQS_PRODUCT_EVENTS_CONSUMER_QUEUE_URL: "https://sqs.us-east-1.amazonaws.com/759316131518/microservices-project-dlq" #url da dlq
      #AWS_ACCESS_KEY_ID: "" #alterar dps
      #AWS_SECRET_ACCESS_KEY: "" #alterar dps
      AWS_REGION: "us-east-1"
    depends_on:
      - kafka
      - user-service
      - product-service

  api-gateway:
    image: ${DOCKERHUB_USERNAME:-local}/api-gateway:latest
    build: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - user-service
      - product-service
      - order-service

networks:
  default:
    driver: bridge