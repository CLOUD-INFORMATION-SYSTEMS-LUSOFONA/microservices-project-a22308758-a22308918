version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    deploy:
      resources:
        limits:
          memory: 150M

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
    deploy:
      resources:
        limits:
          memory: 300M

  user-service:
    image: ${DOCKERHUB_USERNAME:-local}/user-service:latest
    build: ./user-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: ${DB_HOST:-microservices-project-db.cc5akoumm873.us-east-1.rds.amazonaws.com}
      DB_PORT: "5432"
      DB_NAME: "microservicesdb"
      DB_USER: "dbadmin"
      DB_PASSWORD: "ChangeMe123!"
      JAVA_OPTS: "-Xmx160m -Xms64m"
    deploy:
      resources:
        limits:
          memory: 200M

  product-service:
    image: ${DOCKERHUB_USERNAME:-local}/product-service:latest
    build: ./product-service
    ports:
      - "8082:8082"
    environment:
      DB_HOST: ${DB_HOST:-microservices-project-db.cc5akoumm873.us-east-1.rds.amazonaws.com}
      DB_PORT: "5432"
      DB_NAME: "microservicesdb"
      DB_USER: "dbadmin"
      DB_PASSWORD: "ChangeMe123!"
      JAVA_OPTS: "-Xmx160m -Xms64m"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CLOUD_SQS_PRODUCT_EVENTS_ENABLED: "false"
    deploy:
      resources:
        limits:
          memory: 200M
    depends_on:
      - kafka

  order-service:
    image: ${DOCKERHUB_USERNAME:-local}/order-service:latest
    build: ./order-service
    ports:
      - "8083:8083"
    environment:
      DB_HOST: ${DB_HOST:-microservices-project-db.cc5akoumm873.us-east-1.rds.amazonaws.com}
      DB_PORT: "5432"
      DB_NAME: "microservicesdb"
      DB_USER: "dbadmin"
      DB_PASSWORD: "ChangeMe123!"
      JAVA_OPTS: "-Xmx160m -Xms64m"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVICES_USER_URL: http://user-service:8081
      SERVICES_PRODUCT_URL: http://product-service:8082
    deploy:
      resources:
        limits:
          memory: 200M
    depends_on:
      - kafka
      - user-service
      - product-service

  api-gateway:
    image: ${DOCKERHUB_USERNAME:-local}/api-gateway:latest
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: "-Xmx128m -Xms64m"
    deploy:
      resources:
        limits:
          memory: 150M
    depends_on:
      - user-service
      - product-service
      - order-service

networks:
  default:
    driver: bridge